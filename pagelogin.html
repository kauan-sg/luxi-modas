<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>pagelogin</title>
    <link rel="stylesheet" href="pagelogin.css">

<body>
    <div class="main-container">
        <!-- Container para o formulário à esquerda -->
        <div class="form-container">
            <form id="loginForm">
                <label for="nome">Nome:</label>
                <input type="text" id="nome" name="nome" required><br><br>

                <label for="telefone">Telefone:</label>
                <input type="tel" id="telefone" name="telefone" pattern="\([0-9]{2}\) [0-9]{5}-[0-9]{4}" placeholder="(XX) XXXXX-XXXX" required><br><br>

                <button type="submit">Entrar</button>
            </form>
        </div>

        <!-- Container para o scroll com as imagens à direita -->

        </div>
    </div>

    <img src="logoloja.jpeg" width="10%" height="30%" class="ll">

    <script>
        // Função para contar as pessoas que acessaram a página
        function countVisitors() {
            let visitCount = localStorage.getItem('visitCount') || 0;
            visitCount = parseInt(visitCount) + 1;
            localStorage.setItem('visitCount', visitCount);
            console.log('Número de visitantes: ' + visitCount);
        }

        // Chama a função para contar visitantes
        countVisitors();

        // Função para validar o formulário e redirecionar
        document.getElementById('loginForm').addEventListener('submit', function(event) {
            event.preventDefault(); // Impede o envio padrão do formulário

            const nome = document.getElementById('nome').value;
            const telefone = document.getElementById('telefone').value;

            // Verificar se os campos estão preenchidos corretamente
            if (nome && telefone) {
                // Redireciona para outra página (substitua 'pagina-destino.html' pelo seu URL)
                window.location.href = 'inicialpage.html';
            } else {
                alert('Por favor, preencha todos os campos!');
            }
        });
    </script>
